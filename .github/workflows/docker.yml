name: Docker

# Builds the production image and boots it like production (start.sh ->
# prisma db push -> server.js). Guards against a repeat of the 2026-11-09
# outage, where the image built fine but never became healthy.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Image smoke (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: postgres
            db_provider: postgresql
            db_url: postgresql://feedferret:feedferret-change-me@postgres:5432/feedferret?schema=public
          - provider: sqlite
            db_provider: sqlite
            db_url: file:./dev.db
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: feedferret:smoke-${{ matrix.provider }}
          build-args: |
            DATABASE_PROVIDER=${{ matrix.db_provider }}
            DATABASE_URL=${{ matrix.db_url }}
          cache-from: type=gha,scope=docker-${{ matrix.provider }}
          cache-to: type=gha,scope=docker-${{ matrix.provider }},mode=max

      - name: Smoke test (static content + /api/health)
        run: scripts/docker-smoke.sh feedferret:smoke-${{ matrix.provider }} ${{ matrix.provider }}
        env:
          SMOKE_TIMEOUT: 90
